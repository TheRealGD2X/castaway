<style>
:root{

<script>
"use strict";
/* =====================================================================
   THE CASTAWAY
   One man on an island, living in real time, like Animal Crossing: one
   real minute is one minute of his life. His clock, sunrise, sunset and
   seasons follow the real calendar in the time zone he was born in. The simulation is deterministic: the same seed and the
   same starting state always produce the same life, on any device.
   Only +, -, *, /, sqrt, floor and a seeded integer RNG touch the
   simulation state, so every browser computes identical results.
   ===================================================================== */

// ------------------------------------------------------------ constants
const TICKMS = 60000;
const MW = 84, MH = 60, N = MW * MH, DAY = 1440;
const TER = { DEEP:0, SEA:1, SAND:2, GRASS:3, FOREST:4, ROCK:5, LAKE:6, MUD:7 };
const RS = { NONE:0, OAK:1, PINE:2, BUSH:3, BOULDER:4, FLINT:5, FIBER:6, CLAY:7, DRIFT:8 };
const RMAX = [0, 4, 5, 5, 6, 2, 3, 4, 2];
const RBLOCK = [0, 1, 1, 0, 1, 0, 0, 0, 0];
const RGROW = [0, DAY * 6, DAY * 7, 0, DAY * 20, DAY * 3, DAY * 2, DAY * 2, DAY];
const SEASONS = ["Spring", "Summer", "Autumn", "Winter"];
// Sunrise / sunset (local minutes) and mean temperature for each month, roughly a British island.
const SUNM = [[480, 975], [440, 1030], [390, 1085], [375, 1170], [315, 1235], [285, 1275], [300, 1265], [355, 1200], [410, 1125], [455, 1050], [450, 980], [485, 960]];
const TMON = [1, 2, 5, 8, 11, 14, 16, 16, 13, 10, 6, 3];
const MSEASON = [3, 3, 0, 0, 0, 1, 1, 1, 2, 2, 2, 3];
const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const NAMES = ["Elias", "Tomas", "Arlo", "Jonah", "Silas", "Otto", "Milo", "Rowan", "Callum", "Ezra", "Hugo", "Felix"];
const DOGNAMES = ["Biscuit", "Pepper", "Scout", "Rusty", "Juno", "Maple", "Bramble"];
const FOODV = { nuts:16, apples:10, elderberries:8, sloes:6, greens:6, seaweed:5, redcap:6,  berries:12, mushroom:10, tuber:22, rawMeat:24, rawFish:18, cookedMeat:40, cookedFish:32, dried:34, stew:55 };
const FOODS = ["nuts", "apples", "elderberries", "greens", "sloes", "seaweed", "stew", "cookedMeat", "cookedFish", "dried", "tuber", "berries", "mushroom", "rawFish", "rawMeat"];
const MATS = ["wood", "stone", "fiber", "flint", "clay", "hide"];

// ------------------------------------------------------------ deterministic helpers
function h32(x, y, s) {
  let h = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263) + Math.imul(s | 0, 1442695041)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h = (h ^ (h >>> 16)) >>> 0;
  return h / 4294967296;
}
function vn(x, y, sc, s) {
  const fx = x / sc, fy = y / sc, x0 = Math.floor(fx), y0 = Math.floor(fy), tx = fx - x0, ty = fy - y0;
  const sx = tx * tx * (3 - 2 * tx), sy = ty * ty * (3 - 2 * ty);
  const a = h32(x0, y0, s), b = h32(x0 + 1, y0, s), c = h32(x0, y0 + 1, s), d = h32(x0 + 1, y0 + 1, s);

// ------------------------------------------------------------ his body: wounds, infection, scurvy, getting soaked

// pan & zoom (mouse, touch, pinch)
(function () {
  let drag = null, pinch = null;
  const pts = new Map();
  // Touch like a map app: one finger pans, two fingers zoom around the point between them (that spot stays under your
  // fingers), and lifting a finger hands over smoothly with no jump. Screen px -> world units: world = cam + (p - centre)/z.
  const centre = () => [innerWidth / 2, innerHeight / 2];   // the screen's centre (the island canvas is larger than the screen)
  const toWorld = (px, py) => { const c = centre(); return [cam.x + (px - c[0]) / cam.z, cam.y + (py - c[1]) / cam.z]; };
  const stopFollow = () => { if (cam.follow) { cam.follow = false; $("follow").classList.remove("on"); $("follow").setAttribute("aria-pressed", "false"); } };
  const rebase = () => {
    const v = [...pts.values()];
    if (v.length >= 2) { const [a, b] = v, mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2; pinch = { d: Math.max(20, Math.hypot(a[0] - b[0], a[1] - b[1])), z: cam.z, anchor: toWorld(mx, my) }; drag = null; }
    else if (v.length === 1) { pinch = null; drag = [v[0][0], v[0][1], cam.x, cam.y]; }
    else { pinch = null; drag = null; }
  };
  cv.addEventListener("pointerdown", e => { try { cv.setPointerCapture(e.pointerId); } catch (x) {} pts.set(e.pointerId, [e.clientX, e.clientY]); rebase(); });
  cv.addEventListener("pointermove", e => {
    if (!pts.has(e.pointerId)) return; pts.set(e.pointerId, [e.clientX, e.clientY]);
    if (pinch && pts.size >= 2) {
      const [a, b] = [...pts.values()], mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2, c = centre();
      cam.z = clamp(pinch.z * Math.hypot(a[0] - b[0], a[1] - b[1]) / pinch.d, 1, 6);
      // keep the pinched spot under the fingers (this also pans with a two-finger drag)
      stopFollow(); cam.x = pinch.anchor[0] - (mx - c[0]) / cam.z; cam.y = pinch.anchor[1] - (my - c[1]) / cam.z;
      return;
    }
    if (drag) { const dx = e.clientX - drag[0], dy = e.clientY - drag[1]; if (Math.abs(dx) + Math.abs(dy) > 4) stopFollow(); if (!cam.follow) { cam.x = drag[2] - dx / cam.z; cam.y = drag[3] - dy / cam.z; } }
  });
  const up = e => { pts.delete(e.pointerId); rebase(); };
  cv.addEventListener("pointerup", up); cv.addEventListener("pointercancel", up); cv.addEventListener("lostpointercapture", up);
  // mouse wheel / trackpad: zoom around the pointer
  cv.addEventListener("wheel", e => { e.preventDefault(); const px = e.clientX, py = e.clientY, w = toWorld(px, py), c = centre(); cam.z = clamp(cam.z * Math.exp(-e.deltaY * .0015), 1, 6); if (!cam.follow) { cam.x = w[0] - (px - c[0]) / cam.z; cam.y = w[1] - (py - c[1]) / cam.z; } }, { passive: false });
  // iOS Safari's own page pinch must never fight ours
  for (const ev of ["gesturestart", "gesturechange", "gestureend"]) document.addEventListener(ev, e => e.preventDefault(), { passive: false });
})();

// ------------------------------------------------------------ standalone: the island's cloud files, read from the site
// Outside Claude, the world's seed, its latest checkpoint and Tomas's Claude thoughts and diary are small JSON files
// published alongside the game (data/...), written by the scheduled Claude routine. Everything else is deterministic:
// every device replays the same life from the same files. This reader looks like the old database but only reads;
// saves go to this device's own storage so reopening is quick.
async function staticDB() {
  const base = "data/", bust = () => "?v=" + Math.floor(Date.now() / 60000);
  const getJSON = async p => { try { const r = await fetch(base + p + bust(), { cache: "no-store" }); if (!r.ok) return null; return await r.json(); } catch (e) { return null; } };
  const meta = await getJSON("world/meta.json"); if (!meta || meta.seed == null) return null;
  const snap = v => ({ exists: v != null, data: () => v, metadata: {} });
  const docs = arr => ({ docs: (arr || []).map(d => ({ id: d.id, data: () => d })) });
  const db = {
    readonly: true,
    doc(path) {
      return {
        get: async () => snap(await getJSON(path + ".json")),
        set: async () => {}, update: async () => {},
        acquire: async () => ({ acquired: false }),
        onSnapshot: (fn) => { const poll = async () => fn(snap(await getJSON(path + ".json"))); setInterval(poll, 300000); return () => {}; }
      };
    },
    collection(name) {
      return {
        get: async () => docs(await getJSON(name + ".json")),
        onSnapshot: (fn) => { const poll = async () => fn(docs(await getJSON(name + ".json"))); poll(); setInterval(poll, 300000); return () => {}; }
      };
    }
  };
  return db;
}

function cloudWire() {

  const tryLease = async () => {
    try { const r = await lock.acquire({ holder: TAB, ttlMs: 90000 }); isWriter = !!r.acquired; } catch (e) { isWriter = false; }
  };

  db.doc("world/state").onSnapshot(snap => {
    if (!snap.exists || snap.metadata.hasPendingWrites) return;
    const d = snap.data();
    if (!d || d.by === TAB || isWriter || catching) return;
    if (d.t > W.t - 5 && d.t <= W.t + 120) {
      const keepCam = [cam.x, cam.y];
      deserialise(d.blob);
      const target = Math.floor((Date.now() - W.born) / TICKMS);
      while (W.t < target) step();
      cam.x = keepCam[0]; cam.y = keepCam[1];
    }
  }, () => {});
  db.collection("mind").onSnapshot(q => { mindQueue(q.docs.map(d => Object.assign({}, d.data(), { id: d.id }))); }, () => {});
  db.collection("diary").onSnapshot(q => { q.docs.forEach(d => { const v = d.data(); if (v && v.day) claudeDiary[v.day] = v; }); renderPanel(); }, () => {});

// Only the tab holding the save lease asks. Each thought is written to mind/* stamped with the minute it lands on,

Here is everything true about him right now (JSON). Things marked "not in sight" he cannot see; he may only guess about them.
${JSON.stringify(B).slice(0, 16000)}

- "remember": optional, a note to himself worth keeping.
- "plan": optional, ONLY when he has no plan or wants to change it: {"name": short, "why": his reason, "weight": 0.2-1, "steps": ["gather wood 12", "make rope", "wait 3", "build dock", ...]} using verbs gather <material> <n> | have <thing> <n> | build <project key> | make <design or tool name> | wait <days> | explore | practise <skill> <level> | fish <n> | hunt | forage | visit <place id> | tame. Or {"abandon": true, "why": ...}. Watch his psyche: when novelty or purpose is low he needs something new or something to work towards.
- "make": optional, at most occasionally, when a real need or idea calls for it. He can make ANYTHING physically plausible. A material: {"kind":"material","name":...,"what":...,"use":...,"cost":{"fiber":3},"process":["soak","spin"],"makes":2} using the processes in science.processes. A thing: {"kind":"item" or "structure","name":...,"what":...,"use":...,"parts":[{"name":"bowl","material":"fired clay or a base material","shape":one of science.shapes,"amount":2}],"slot":"head|body|feet|back|hand|none","near":"home|lake|beach|forest"}. The world works out what it does from the materials' properties (science.materials) and shapes, and he can fail if unskilled.

    const { text } = await sample(prompt, { modelTier: "quick" });

// -- his voice: Claude writes a diary entry from the facts of the day (on request only)
async function voiceDiary(day, btn) {
  if (!sample) { toast("His own words need Claude, which isn't available here."); return; }
  const p = W.diary.find(x => x.d === day); if (!p) return;
  btn.disabled = true; btn.textContent = "Thinking…";
  const facts = W.ev.filter(e => e.d === day).map(e => "- " + e.a).join("\n") || "- An ordinary day of survival.";
  const m = W.m, traits = Object.entries(m.trait).sort((a, b) => b[1] - a[1]).slice(0, 2).map(x => x[0]).join(" and ");
  const prompt = `You are writing one private diary entry for ${m.name}, a man stranded alone on a small island, living day by day. He is ${traits}. Write in first person, plain and honest, 70–110 words, no title, no date line, British spelling. Base it ONLY on these facts from day ${day}, and don't invent rescues, people or anything that didn't happen:\n${facts}\nHis rough notes from that day: "${p.txt}"\nSeason: ${SEASONS[season()]}. Days on the island: ${day}.`;
  try {
    const { text } = await sample(prompt, { modelTier: "quick" });
    const v = { day, text: text.trim(), at: Date.now() };
    claudeDiary[day] = v;
    if (db) { try { await db.doc("diary/d" + day).set(v); } catch (e) {} }
    renderPanel();
  } catch (e) {
    btn.disabled = false; btn.textContent = e && e.code === "not_granted" ? "Not allowed" : "Try again";
  }
}
async function writeLetter(evs, gap, btn) {
  if (!sample) { toast("His own words need Claude, which isn't available here."); return; }
  btn.disabled = true; btn.textContent = "Writing…";
  const m = W.m;
  const facts = evs.slice(-20).map(e => `- ${clockStr(e.t)}: ${e.a}`).join("\n");
  const prompt = `${m.name} is stranded alone on an island. Someone he doesn't know is out there watching over him. Write what he'd scribble in his journal summing up the last ${fmtDur(gap)} of his life, in first person, 90–140 words, British spelling, honest and human. Use ONLY these facts and invent nothing else:\n${facts}\n${m.alive ? "He is still alive." : "He died of " + m.cause + "; write his final entry up to just before the end, calm and brave."}`;
  const out = $("letter");
  out.innerHTML = `<div class="page"><div id="lt">…</div><div class="by">Written with Claude from what really happened</div></div>`;
  try {
    await sample(prompt, { modelTier: "quick", onText: ({ text }) => { const el = $("lt"); if (el) el.textContent = text; } });
    btn.remove();
  } catch (e) { btn.disabled = false; btn.textContent = "Try again"; }
}

// Map-app smoothness: the island is drawn a little larger than the screen about 30 times a second, and every screen

  if (!R.t || now - R.t >= 32 || moved || zoomed) {
    const pt = L3.pt || {}, t0 = performance.now();
    render(T);
    const t1 = performance.now();
    renderMini();
    const t2 = performance.now(); pt.frame = (pt.frame || 0) + t1 - t0; pt.mini = (pt.mini || 0) + t2 - t1; pt.renders = (pt.renders || 0) + 1;

}

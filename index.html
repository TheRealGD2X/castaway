<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>The Castaway</title>
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-180.png"><meta name="apple-mobile-web-app-title" content="Castaway">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#174b66">
<style>
:root{color-scheme:dark}
html,body{margin:0;height:100%;background:#174b66;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
#c{position:fixed;left:0;top:0;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none}
#hud{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:10px;padding:7px 12px;border-radius:12px;background:rgba(43,29,22,.72);color:#f6e4b0;font:600 13px ui-rounded,system-ui,sans-serif;letter-spacing:.02em;border:2px solid #2b1d16;box-shadow:0 2px 0 rgba(0,0,0,.25)}
#act{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));max-width:84vw;padding:8px 14px;border-radius:14px;background:rgba(43,29,22,.74);color:#f6e4b0;font:600 14px ui-rounded,system-ui,sans-serif;border:2px solid #2b1d16;text-align:center;cursor:pointer}
#why{display:none;margin-top:5px;font-weight:500;font-size:12.5px;color:#e8d6aa;white-space:pre-line;line-height:1.35}
#follow{display:none;position:fixed;right:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));width:40px;height:40px;border-radius:20px;background:rgba(43,29,22,.74);border:2px solid #2b1d16;color:#f6e4b0;font:700 18px system-ui;cursor:pointer}
#snd{position:fixed;right:10px;top:calc(10px + env(safe-area-inset-top,0px));width:38px;height:38px;border-radius:19px;background:rgba(43,29,22,.72);border:2px solid #2b1d16;color:#f6e4b0;font:700 17px system-ui;opacity:.6;cursor:pointer}
#jbtn{position:fixed;right:54px;top:calc(10px + env(safe-area-inset-top,0px));width:38px;height:38px;border-radius:19px;background:rgba(43,29,22,.72);border:2px solid #2b1d16;color:#f6e4b0;font:700 17px system-ui;cursor:pointer}
#journal{display:none;position:fixed;left:12px;right:12px;top:calc(60px + env(safe-area-inset-top,0px));bottom:calc(70px + env(safe-area-inset-bottom,0px));overflow:auto;padding:14px 16px;border-radius:14px;background:rgba(246,228,176,.96);color:#2b1d16;font:15px/1.5 Georgia,serif;border:2px solid #2b1d16;-webkit-overflow-scrolling:touch}
#journal h3{margin:0 0 8px;font:700 16px ui-rounded,system-ui}#journal p{margin:0 0 12px}
#load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#f6e4b0;font:600 16px ui-rounded,system-ui;background:#174b66}

/* Calm paper journal; broad tap targets and normal finger scrolling on a phone. */
#journal{color-scheme:light;left:10px;right:10px;top:calc(62px + env(safe-area-inset-top,0px));bottom:calc(72px + env(safe-area-inset-bottom,0px));padding:0;border:1px solid #a69267;border-radius:18px;background:#f4efda;box-shadow:0 12px 40px #27352d66;font:16px/1.55 Georgia,serif;touch-action:pan-y;user-select:text;-webkit-user-select:text;overscroll-behavior:contain}
.journal-head{display:flex;align-items:center;justify-content:space-between;padding:22px 22px 10px}
.eyebrow{font:700 10px system-ui;letter-spacing:.18em;color:#827050}
.journal-head h2{font:500 24px/1.15 Georgia,serif;letter-spacing:-.03em;margin:5px 0;color:#433925}
.journal-close{width:44px;height:44px;flex-shrink:0;border:0;border-radius:50%;background:#e7dfc5;color:#68553b;font:26px system-ui;cursor:pointer}
.journal-intro{padding:0 22px 18px;color:#817359;font:13px/1.5 system-ui}
.journal-tabs{display:flex;padding:0 14px;border-bottom:1px solid #d6cdb0;gap:3px;position:sticky;top:0;background:#f4efda;z-index:1}
.journal-tabs button{flex:1;min-height:47px;background:none;border:0;border-bottom:3px solid transparent;color:#8a7b5d;font:600 12px system-ui;cursor:pointer}
.journal-tabs button[aria-pressed=true]{border-bottom-color:#778658;color:#46533a}
.journal-body{padding:20px 22px 26px}.story-card{display:grid;grid-template-columns:24px 1fr;gap:12px;padding-bottom:23px;position:relative}
.story-mark{color:#7f8c61;font:21px Georgia}.story-card time,.diary-card time{font:600 11px system-ui;letter-spacing:.04em;color:#978464}
#journal .story-card p{margin:5px 0 12px;font-size:16px;color:#524632}
.camp-picture{width:100%;max-width:360px;aspect-ratio:1.8;display:block;image-rendering:pixelated;border-radius:8px;border:1px solid #d2c7a5;margin:8px 0 4px}
.diary-card{padding:0 0 24px}.diary-card p{white-space:normal;margin-top:9px!important;color:#584b36}
#journal h3{font:600 13px system-ui;margin:24px 0 12px;color:#6e7852}.home-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #ded6bb;font:13px system-ui}.home-row strong{font-weight:500;text-transform:capitalize}.home-row span{font-size:11px;color:#8b7d61;text-align:right}
#hud{background:rgba(49,55,43,.88);border:1px solid #b6b18b55;color:#f3ebce;box-shadow:0 2px 12px #24302733;padding:9px 12px;border-radius:13px;font-size:12px}
#jbtn,#snd,#follow{width:44px;height:44px;border:1px solid #b6b18b55;background:rgba(49,55,43,.88);border-radius:50%;color:#f3ebce}#jbtn{right:61px}#snd{right:10px}
#act{border:1px solid #b6b18b55;background:rgba(49,55,43,.9);box-shadow:0 3px 12px #24302733;color:#f3ebce;padding:11px 17px;border-radius:16px;font-size:14px}
#why{color:#ded5b4;line-height:1.5;margin-top:10px}

</style></head>
<body><canvas id="c"></canvas><div id="load">The tide is bringing you in…</div><div id="hud"><span id="clk">…</span></div>
<div id="act"><span>…</span><div id="why"></div></div><button id="follow" aria-label="Find Tomas">◎</button><button id="snd" aria-label="Sound">♪̸</button><button id="jbtn" aria-label="Journal">✎</button><div id="journal"></div>
<script type="module" src="v2/src/main.js"></script>
</body></html>

<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>The Castaway</title>
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-180.png"><meta name="apple-mobile-web-app-title" content="Castaway">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#174b66">
<style>
:root{color-scheme:dark}
html,body{margin:0;height:100%;background:#174b66;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
#c{position:fixed;left:0;top:0;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none}
#hud{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:10px;padding:7px 12px;border-radius:12px;background:rgba(43,29,22,.72);color:#f6e4b0;font:600 13px ui-rounded,system-ui,sans-serif;letter-spacing:.02em;border:2px solid #2b1d16;box-shadow:0 2px 0 rgba(0,0,0,.25)}
#act{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));max-width:84vw;padding:8px 14px;border-radius:14px;background:rgba(43,29,22,.74);color:#f6e4b0;font:600 14px ui-rounded,system-ui,sans-serif;border:2px solid #2b1d16;text-align:center;cursor:pointer}
#why{display:none;margin-top:5px;font-weight:500;font-size:12.5px;color:#e8d6aa;white-space:pre-line;line-height:1.35}
#follow{display:none;position:fixed;right:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));width:40px;height:40px;border-radius:20px;background:rgba(43,29,22,.74);border:2px solid #2b1d16;color:#f6e4b0;font:700 18px system-ui;cursor:pointer}
#snd{position:fixed;right:10px;top:calc(10px + env(safe-area-inset-top,0px));width:38px;height:38px;border-radius:19px;background:rgba(43,29,22,.72);border:2px solid #2b1d16;color:#f6e4b0;font:700 17px system-ui;opacity:.6;cursor:pointer}
#jbtn{position:fixed;right:54px;top:calc(10px + env(safe-area-inset-top,0px));width:38px;height:38px;border-radius:19px;background:rgba(43,29,22,.72);border:2px solid #2b1d16;color:#f6e4b0;font:700 17px system-ui;cursor:pointer}
#journal{display:none;position:fixed;left:12px;right:12px;top:calc(60px + env(safe-area-inset-top,0px));bottom:calc(70px + env(safe-area-inset-bottom,0px));overflow:auto;padding:14px 16px;border-radius:14px;background:rgba(246,228,176,.96);color:#2b1d16;font:15px/1.5 Georgia,serif;border:2px solid #2b1d16;-webkit-overflow-scrolling:touch}
#journal h3{margin:0 0 8px;font:700 16px ui-rounded,system-ui}#journal p{margin:0 0 12px}
#load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#f6e4b0;font:600 16px ui-rounded,system-ui;background:#174b66}
</style></head>
<body><canvas id="c"></canvas><div id="load">The tide is bringing you in…</div><div id="hud"><span id="clk">…</span></div>
<div id="act"><span>…</span><div id="why"></div></div><button id="follow" aria-label="Find Tomas">◎</button><button id="snd" aria-label="Sound">♪̸</button><button id="jbtn" aria-label="Journal">✎</button><div id="journal"></div>
<script type="module" src="v2/src/main.js"></script>
</body></html>

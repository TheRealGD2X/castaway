<!doctype html><html lang="en"><meta charset="utf-8"><title>Castaway · Living Tomas</title><style>*{box-sizing:border-box}body{background:#23372f;color:#e9e2c9;font:14px system-ui;margin:0}header{padding:24px 32px;border-bottom:1px solid #89946b44;display:flex;justify-content:space-between;align-items:center}h1{font:28px Georgia;margin:0 0 6px}p{color:#b5c1a7;margin:0}a{color:#e7d397}select{background:#314d3d;color:#efe6c7;padding:12px;border:1px solid #97a37a;border-radius:8px;font:14px system-ui}main{max-width:1200px;margin:24px auto;padding:0 24px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}figure{margin:0;border:1px solid #82966d55;border-radius:8px;overflow:hidden}canvas{display:block;width:100%;height:220px;object-fit:contain;image-rendering:pixelated;background:#939f70}figcaption{padding:14px;background:#304b3b}.controls{display:flex;gap:18px;align-items:center;margin-bottom:24px}</style>
<header><div><h1>Living Tomas</h1><p>Independent breathing, gaze, blink, and body state layered over his actions.</p></div><a href="./art-review.html">Return to island →</a></header><main><div class="controls"><label for="action">Action</label><select id="action" aria-label="Action"></select><p>Animation study · These examples do not alter his life on the island.</p></div><div class="grid" id="grid"></div></main>
<script type="module">
import {ANIM} from './src/render/people.js';import {rigSprite} from './src/render/rig.js';import {lifeMotion} from './src/render/life-motion.js';import {loadSceneArt} from './src/render/scene-art.js';
await loadSceneArt();const select=document.querySelector('#action');for(const key of Object.keys(ANIM)){const o=document.createElement('option');o.value=key;o.textContent=key.replace(/([a-z])([A-Z])/g,'$1 $2');select.append(o);}select.value='sit';
const cases=[['Rested',{fatigue:.1,shiver:0,wet:0}],['Tired',{fatigue:.9,sleepP:.9,shiver:0,wet:0}],['Cold and shivering',{fatigue:.3,shiver:1,wet:.5}],['Soaked clothing',{fatigue:.2,shiver:.2,wet:1}],['Carrying weight',{fatigue:.4,shiver:0,wet:.1},5],['Sleeping · slow breathing',{fatigue:.5,shiver:0,wet:.1,asleep:true}]];
const cards=cases.map(([label,B,loadKg=0],i)=>{const fig=document.createElement('figure'),cv=document.createElement('canvas'),text=document.createElement('figcaption');cv.width=330;cv.height=220;text.textContent=label;fig.append(cv,text);document.querySelector('#grid').append(fig);return {cv,B:{alive:true,hurt:[],...B},loadKg,i};});
let last=-1;function frame(now){requestAnimationFrame(frame);if(now-last<1000/60-.5)return;last=now;for(const {cv,B,loadKg,i} of cards){const spec={...ANIM[B.asleep?'sleep':select.value],wet:Math.round(B.wet*32)/32,loadKg,mood:B.fatigue>.7?'tired':'calm'};spec.key=select.value+':'+i;spec.life=lifeMotion(B,spec,now,71);const sp=rigSprite(spec,now),g=cv.getContext('2d');g.imageSmoothingEnabled=false;g.clearRect(0,0,330,220);g.fillStyle='#788866';g.fillRect(70,195,190,1);g.drawImage(sp.img,85,42,sp.w*4,sp.h*4);}}
requestAnimationFrame(frame);
</script></html>

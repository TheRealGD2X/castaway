<!doctype html><html lang="en"><meta charset="utf-8"><title>Castaway · Art variations</title>
<style>*{box-sizing:border-box}body{margin:0;background:#23372f;color:#e6e1c8;font:14px system-ui}header{padding:24px 36px;border-bottom:1px solid #7d886746;display:flex;justify-content:space-between;align-items:center}h1{font:28px Georgia;margin:0 0 8px}p{color:#b5c1a7;margin:0}a{color:#e6d7a1}main{max-width:1400px;margin:auto;padding:24px}h2{font:24px Georgia;margin:36px 0 12px}.family{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}figure{margin:0;border:1px solid #86956a50;border-radius:8px;overflow:hidden;background:#2f473b}canvas{width:100%;height:150px;object-fit:contain;image-rendering:pixelated;background:#8e9b70}figcaption{padding:12px;font-size:12px}#status{margin:12px 0;color:#b5c1a7}</style>
<header><div><h1>The Castaway · Art variations</h1><p>The same objects through growth, seasons, weather, and use.</p></div><a href="./art-review.html">Return to island →</a></header><main id="gallery"><div id="status">Loading artwork…</div></main>
<script type="module">
import {loadWoodlandArt} from './src/render/woodland-art.js';import {loadSceneArt} from './src/render/scene-art.js';import {loadWaterArt} from './src/render/water.js';
import {tree,shrub,rock,branch} from './src/render/sprites.js';import {rigSprite} from './src/render/rig.js';import {gullSprite,rabbitSprite,raftSprite,snareSprite,scrapsSprite} from './src/render/beasts.js';import {jointedDog} from './src/render/dogrig.js';import {bedSprite,pileSprite,structSprite} from './src/render/structs.js';import {load,save} from './src/sim/world.js';
const gallery=document.querySelector('#gallery');await Promise.all([loadWoodlandArt(),loadSceneArt(),loadWaterArt()]);
let row;function family(title){const h=document.createElement('h2');h.textContent=title;gallery.append(h);row=document.createElement('div');row.className='family';gallery.append(row);}
function card(label,sp){if(!sp)return;const fig=document.createElement('figure'),cv=document.createElement('canvas'),text=document.createElement('figcaption');cv.width=330;cv.height=150;text.textContent=label;fig.append(cv,text);row.append(fig);const g=cv.getContext('2d');g.imageSmoothingEnabled=false;
 const iw=sp.img.width,ih=sp.img.height,d=sp.img.getContext?sp.img.getContext('2d').getImageData(0,0,iw,ih).data:null;let l=0,t=0,r=iw-1,b=ih-1;
 if(d){l=iw;t=ih;r=-1;b=-1;for(let y=0;y<ih;y++)for(let x=0;x<iw;x++)if(d[(y*iw+x)*4+3]>24){l=Math.min(l,x);t=Math.min(t,y);r=Math.max(r,x);b=Math.max(b,y);}}
 if(r<l)return;const n=iw/(sp.w||iw),w=(r-l+1)/n,h=(b-t+1)/n,k=Math.min(4,Math.floor(Math.min(300/w,135/h)));g.drawImage(sp.img,l,t,r-l+1,b-t+1,Math.round((330-w*k)/2),Math.round((150-h*k)/2),w*k,h*k);
}
function wholeTree(kind,autumn,fall=0,snow=0){const s=tree(kind,1,71,{autumn,fall,snow}),n=s.crownScale||1,cw=s.crown?s.crown.width/n:0,ch=s.crown?s.crown.height/n:0,w=Math.max(cw,s.trunkW),h=ch+s.trunkH;const cv=document.createElement('canvas');cv.width=w*3;cv.height=h*3;const g=cv.getContext('2d');g.imageSmoothingEnabled=false;g.drawImage(s.trunk,0,(h-s.trunkH)*3,s.trunkW*3,s.trunkH*3);if(s.crown)g.drawImage(s.crown,0,6*3,cw*3,ch*3);return{img:cv,w,h};}
for(const kind of ['oak','birch','rowan','hazel','pine']){family(kind[0].toUpperCase()+kind.slice(1));card('Summer',wholeTree(kind,0));card('Turning',wholeTree(kind,.45,.08));card('Late autumn',wholeTree(kind,1,.5));card('Winter',wholeTree(kind,1,kind==='pine'?0:1,4));}
for(const kind of ['fern','bramble','gorse','reeds']){family(kind[0].toUpperCase()+kind.slice(1));for(const [label,state,size] of [['New growth',{autumn:0,fruit:0,flower:0},.5],['Mature / flowering',{autumn:0,fruit:0,flower:1},1],['Fruit / seed heads',{autumn:.2,fruit:1,flower:0},1],['Autumn / dormant',{autumn:1,fall:1},1]]){const s=shrub(kind,size,71,state);card(label,{...s,w:s.img.width/(s.scale||1)});}}
family('Ground and grass');for(const name of ['healthy','dry','damp','worn']){const img=new Image();await new Promise(resolve=>{img.onload=resolve;img.src='./assets/ground/'+name+'.png';});card(name,{img,w:128});}
family('Rocky ground');for(const name of ['rock-neutral','rock-damp','rock-moss','rock-dry']){const img=new Image();await new Promise(resolve=>{img.onload=resolve;img.src='./assets/ground/'+name+'.png';});card(name.replace('rock-',''),{img,w:128});}
family('Boulders and gathered stones');for(const [k,wet,snow] of [['boulder',0,0],['boulder',1,0],['boulder',0,1],['stones',0,0]]){const s=rock(k,1,71,{wet,snow});card(k+(snow?' · snow':wet?' · wet':' · dry'),{...s,w:s.img.width/(s.scale||1)});}
family('Driftwood on land and water');for(const [label,wet,season] of [['Dry',0,{}],['Wet',1,{}],['Weathered',.4,{age:1}],['Snow',0,{snow:4}]])card(label,branch(2,71,wet,season));
family('Tomas');for(const [label,stance,mood,wet] of [['Resting','sit','calm',0],['Working','kneel','calm',0],['Tired and soaked','sit','tired',1],['Sleeping','lie','tired',0]])card(label,rigSprite({key:label,stance,mood,wet,work:[5,-6],motion:'rest',lean:.05},1000));
family('Wildlife and the hatch-cover raft');card('Dog · resting',jointedDog({act:'lie'},0));card('Gull · flying',gullSprite('fly',300,1));card('Rabbit · grazing',rabbitSprite('graze',500,1));card('Dog adrift',raftSprite(0));
family('Shellfish exposed by the tide');for(const [k,kg] of [['mussels',2],['mussels',9],['cockles',2],['cockles',9]])card(k+' · '+kg+' kg',bedSprite(k,kg,71));
family('Small camp objects');card('Snare · set',snareSprite(true,false));card('Snare · caught',snareSprite(true,true));card('Food scraps',scrapsSprite({k:'scraps',kcal:200}));card('Rabbit brought by the dog',scrapsSprite({k:'quarry',kcal:400}));
family('Materials brought to camp');for(const k of ['poles','stones','reeds','bracken'])card(k,pileSprite(k,7));
const cp=await fetch('./assets/preview/camp.json').then(r=>r.json()),W=load(cp.blob),before=save(W);family('Structures as installed');for(const s of W.structs)card(s.k,structSprite(s));
document.querySelector('#status').dataset.result=save(W)===before?'passed':'failed';document.querySelector('#status').textContent=save(W)===before?'Artwork loaded · Saved simulation state preserved.':'Rendering changed the saved state.';
</script></html>
